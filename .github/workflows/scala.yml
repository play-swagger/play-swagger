name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Install sbt
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
    - name: Check Format by scalafmt
      run:
        sbt scalafmtSbtCheck scalafmtCheckAll
    - name: Check Lint by scalafix
      run:
        sbt scalafixEnable "scalafixAll --check"
    - name: Sbt Plugin tests
      run:
        sbt clean +playSwagger/publishLocal sbtPlaySwagger/scripted
    - name: Core Lib tests
      run:
        sbt ';project playSwagger;clean;+test'
    - name: Example compile and test
      run:
        sbt publishForExample && cd example && sbt clean scalafmtSbtCheck scalafmtCheckAll scalafixEnable "scalafixAll --check" test

  tests-scala-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala:
          - '3.9.0'
          - '3.10.1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Install sbt
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
    - name: Core Lib tests (Scala ${{ matrix.scala }})
      run:
        sbt ';project playSwagger;clean;++${{ matrix.scala }}!;test'
